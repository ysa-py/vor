[workspace]
resolver = "2"
members = [
    "daemon",
    "extensions/wasm-obfuscator",
    "wasm-obfuscator",
]

[workspace.package]
version = "7.0.0-vip-ultra"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/unifiedshield/MICAFP-UnifiedShield-vip-ultra"
description = "MICAFP UnifiedShield VIP-ULTRA — Complete Unified Anti-Censorship Platform (8-project merge)"
authors = ["UnifiedShield Team"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.10"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["serde", "static_secrets"] }
rand = "0.8"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
async-trait = "0.1"
rand_distr = "0.4"
