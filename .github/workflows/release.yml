name: Release

# The coordinated five-platform release pipeline. One tag `vor-v*` builds
# every platform artifact and attaches all of them to ONE GitHub release.
# Every platform job runs its unit tests + lint first and fails loudly.

on:
  push:
    tags: ["vor-v*"]

permissions:
  contents: write

jobs:
  android:
    name: Android signed APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      # (setup-gradle has no working-directory input; the Gradle cache
      # auto-discovers the android/ project root)
      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#vor-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: google-services.json (optional)
        working-directory: android
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            printf '%s' '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
          else
            # Same placeholder fallback as ci.yml: the google-services plugin
            # is applied unconditionally in :app, so a file must exist even
            # when no Firebase project is configured. Without this the whole
            # release job dies at :app:processDebugGoogleServices.
            cp app/google-services.json.example app/google-services.json
            python3 - <<'PY'
          import json
          # rewrite the placeholder package name to this project's appId
          cfg = json.load(open('app/google-services.json'))
          for client in cfg.get('client', []):
              info = client.get('client_info', {}).get('android_client_info', {})
              if info.get('package_name'):
                  info['package_name'] = 'com.v2rayez.app'
          json.dump(cfg, open('app/google-services.json', 'w'), indent=2)
          PY
          fi
      - name: Release keystore (REQUIRED — unsigned APKs cannot be installed)
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          # Android's package installer (and even `adb install`) REFUSES
          # unsigned APKs — an unsigned release is a broken deliverable.
          # This is a hard gate, not a notice: fail loudly if the secrets
          # are missing instead of shipping APKs nobody can install.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set — release APKs would be UNSIGNED and un-installable. Set KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEYSTORE_ALIAS secrets."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEYSTORE_ALIAS" ]; then
            echo "::error::KEYSTORE_PASSWORD/KEYSTORE_ALIAS secrets missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          # The decoded keystore must be a readable JKS/PKCS12 store — fail
          # here rather than deep inside Gradle's signing task.
          keytool -list -keystore release.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEYSTORE_ALIAS" >/dev/null
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEYSTORE_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF
      - name: Build, test, lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
            :license-manager:testVerifierDebugUnitTest \
            :license-manager:testIssuerDebugUnitTest \
            :app:lintRelease --stacktrace
          # Addon resolution is self-hosted: THIS repo + THIS tag. The release
          # job below stages the addon zips as assets of this same release, so
          # the in-app Core Manager resolves packs without depending on any
          # other repository.
          # Verifier ONLY: the issuer build variant is the maintainer's
          # private signing app — it is never built into public releases.
          ./gradlew :app:assembleRelease :license-manager:assembleVerifierRelease \
            -Pv2rayez.addons.githubRepo=ysa-py/Vor \
            -Pv2rayez.addons.releaseTag="${GITHUB_REF_NAME}" \
            -Pvor.licensePublicKey="${{ secrets.VOR_LICENSE_PUBLIC_KEY }}" \
            --stacktrace
      - name: Stage artifacts
        working-directory: android
        run: |
          mkdir -p release-assets
          VER="${{ steps.version.outputs.version }}"
          # AGP splits put EVERY apk in outputs/apk/release/ (single dir) named
          # app-<abi>-release.apk (signed now that the keystore gate is mandatory).
          staged=0
          for f in app/build/outputs/apk/release/app-*-release*.apk; do
            [ -f "$f" ] || continue
            base="$(basename "$f" .apk)"           # app-arm64-v8a-release[-unsigned]
            base="${base/-unsigned/}"
            abi="${base#app-}"; abi="${abi%-release}"
            cp "$f" "release-assets/Vor-v${VER}-android-${abi}-release.apk"
            staged=$((staged+1))
          done
          if ls license-manager/build/outputs/apk/issuer/release/*.apk >/dev/null 2>&1; then
            echo "::error::issuer-variant APK found in release outputs — the issuer build must never be published"
            exit 1
          fi
          for f in license-manager/build/outputs/apk/verifier/release/*.apk; do
            [ -f "$f" ] || continue
            cp "$f" "release-assets/Vor-v${VER}-license-manager-release.apk"
            staged=$((staged+1))
          done
          if [ "$staged" -eq 0 ]; then
            echo "::error::no Android APKs staged — check assembleRelease outputs"
            exit 1
          fi
          # A leftover *-unsigned* file means the signing config silently
          # failed to apply — that must never reach the release.
          if ls app/build/outputs/apk/release/*-unsigned*.apk >/dev/null 2>&1 \
             || ls license-manager/build/outputs/apk/verifier/release/*-unsigned*.apk >/dev/null 2>&1; then
            echo "::error::unsigned APK produced despite keystore being set — signingConfig is not wired (check keystore.properties)"
            ls -la app/build/outputs/apk/release/ license-manager/build/outputs/apk/verifier/release/
            exit 1
          fi
          echo "staged $staged APKs"
          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)
      - name: Play Protect permission audit (allowlist gate)
        working-directory: android
        run: |
          # v1.0.1 hard gate, added after a real-world defect: the v1.0.0
          # sideloaded app tripped Google Play Protect's "App blocked to
          # protect your device" because its merged manifest carried
          # QUERY_ALL_PACKAGES (own) + AD_ID / ACCESS_ADSERVICES_* /
          # BIND_GET_INSTALL_REFERRER_SERVICE (injected by the
          # firebase-analytics AAR) — a data-harvesting profile for an
          # unknown certificate. Every STAGED (user-facing) APK must now
          # match its module allowlist exactly, or the release fails.
          set -euo pipefail
          fail=0
          for apk in release-assets/*.apk; do
            case "$(basename "$apk")" in
              *license-manager-issuer*) MODULE=license-manager-issuer ;;
              *license-manager*) MODULE=license-manager ;;
              *) MODULE=app ;;
            esac
            if ! bash ../scripts/audit-apk-permissions.sh "$apk" "$MODULE"; then
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "permission audit passed for all $(ls release-assets/*.apk | wc -l) staged APKs"
      - name: Verify APK signatures (apksigner, cert must match the release keystore)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          # Microscope-level gate, added after a real-world defect: v1.0.0
          # shipped unsigned APKs that Android's package installer refused
          # to install. Now every staged APK must (a) verify with apksigner
          # AND (b) be signed by the SAME certificate as the release keystore.
          set -euo pipefail
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$APKSIGNER" ]; then
            yes | sdkmanager "build-tools;35.0.0" >/dev/null 2>&1 || true
            APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in ANDROID_HOME build-tools"
            exit 1
          fi
          echo "using apksigner: $APKSIGNER"
          # Expected certificate SHA-256 fingerprint, straight from the keystore.
          EXPECTED="$(keytool -list -keystore release.jks -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEYSTORE_ALIAS" | sed -n 's/.*SHA-256[^:]*: *//p' | tr -d ' :' | tr 'A-F' 'a-f')"
          echo "expected cert SHA-256: $EXPECTED"
          [ -n "$EXPECTED" ] || { echo "::error::could not extract keystore cert fingerprint"; exit 1; }
          fail=0
          for apk in release-assets/*.apk; do
            if ! "$APKSIGNER" verify --print-certs "$apk" > /tmp/verify.out 2>/tmp/verify.err; then
              echo "::error::$(basename "$apk") does NOT verify: $(cat /tmp/verify.err)"
              fail=1; continue
            fi
            GOT="$(sed -n 's/.*SHA-256 digest: *//p' /tmp/verify.out | head -1 | tr -d ' :' | tr 'A-F' 'a-f')"
            if [ "$GOT" != "$EXPECTED" ]; then
              echo "::error::$(basename "$apk") signed by the WRONG certificate (got $GOT, expected $EXPECTED)"
              fail=1
            else
              echo "OK: $(basename "$apk") verified — cert matches the release keystore"
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "ALL $(ls release-assets/*.apk | wc -l) APKs are signed by the Vor release certificate"
      - name: Stage + pack addon zips (Core Manager download source)
        working-directory: android
        run: |
          set -euo pipefail
          # 1) Fetch the checksum-pinned vendor binaries (psiphon-tunnel-core,
          #    dnstt) per scripts/addon-vendor-sources.json into
          #    build/vendor-addons/<abi>/<binaryName> — sha256-verified over HTTPS.
          python3 - <<'PY'
          import hashlib, io, json, os, urllib.request, zipfile
          spec = json.load(open('scripts/addon-vendor-sources.json'))
          out = 'build/vendor-addons'
          staged = 0
          for vendor in spec.get('vendors', []):
              pack, bin_name = vendor['packId'], vendor['binaryName']
              for abi, src in vendor.get('sources', {}).items():
                  if not src:
                      continue
                  url, want = src['url'], src['sha256']
                  print(f'vendor {pack}/{abi}: {url}')
                  with urllib.request.urlopen(url, timeout=120) as r:
                      blob = r.read()
                  got = hashlib.sha256(blob).hexdigest()
                  if got != want:
                      raise SystemExit(f'::error::sha256 mismatch for {pack}/{abi}: got {got}, want {want}')
                  dest = os.path.join(out, abi)
                  os.makedirs(dest, exist_ok=True)
                  if src.get('format') == 'zip':
                      with zipfile.ZipFile(io.BytesIO(blob)) as z:
                          members = [m for m in z.namelist() if not m.endswith('/')]
                          match = [m for m in members if m.endswith('/' + bin_name) or m == bin_name]
                          if not match:
                              raise SystemExit(f'::error::{bin_name} not found in vendor zip for {pack}/{abi}')
                          data = z.read(match[0])
                  else:
                      data = blob
                  with open(os.path.join(dest, bin_name), 'wb') as f:
                      f.write(data)
                  staged += 1
          print(f'staged {staged} vendor binaries (all sha256-verified)')
          PY
          # 2) Pack every per-addon per-ABI zip (jniLibs natives + vendor
          #    binaries) exactly as the in-app AddonPackManager resolves them
          #    (<packId>-<abi>.zip on THIS release, THIS tag).
          VER="${{ steps.version.outputs.version }}"
          bash scripts/pack-addons.sh "vor-v${VER}" release-assets/addons build/vendor-addons
          # 3) Merge the addon checksums into the staged artifact set.
          cat release-assets/addons/SHA256SUMS.txt >> release-assets/SHA256SUMS.addons.txt
          rm release-assets/addons/SHA256SUMS.txt release-assets/addons/RELEASE_NOTES.md
          n=$(ls release-assets/addons/*.zip | wc -l)
          [ "$n" -ge 20 ] || { echo "::error::expected >=20 addon zips (5 native + 2 vendor per ABI), got $n"; exit 1; }
          echo "staged $n addon zips"
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: android/release-assets/*
          retention-days: 5

  desktop-windows:
    name: Windows exe (portable + installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: desktop/go.sum
      - name: Test + build
        working-directory: desktop
        run: |
          go vet ./...
          go test ./...
          # embed the production license public key when configured
          # (link-time var: desktop/internal/server/license_gate.go)
          go build -trimpath -ldflags "-s -w -X ezsni/internal/server.vorLicensePublicKey=${{ secrets.VOR_LICENSE_PUBLIC_KEY }}" -o "Vor-desktop.exe" .
      - name: NSIS installer
        working-directory: desktop
        shell: pwsh
        run: |
          # windows-latest images ship NSIS; install on demand if missing.
          # NOTE: a choco install updates the MACHINE Path, which the CURRENT
          # pwsh session does not see — re-read it, and fall back to the
          # canonical install location.
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
              choco install nsis -y --no-progress
            }
            $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + $env:Path
            $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
            if (-not $makensis -and (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
              $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
            }
          }
          if (-not $makensis) {
            Write-Error "::error::makensis not found after NSIS install"; exit 1
          }
          Write-Host "using makensis: $makensis"
          $VERSION = "${env:GITHUB_REF_NAME}" -replace '^vor-v',''
          # NOTE: pass the define as ONE pre-built quoted token - pwsh passed
          # the literal string "$VERSION" when it was inline after -DVERSION=.
          $define = '-DVERSION=' + $VERSION
          & $makensis $define 'installer\vor.nsi'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "Vor-desktop-setup.exe")) {
            Write-Error "::error::NSIS installer was not produced"; exit 1
          }
          if ((Get-Item "Vor-desktop-setup.exe").Length -lt 1000000) {
            Write-Error "::error::NSIS installer implausibly small"; exit 1
          }
      - name: Stage portable bundle
        working-directory: desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "Vor-desktop.exe" release-assets/
          Copy-Item "Vor-desktop-setup.exe" release-assets/
          Copy-Item "WinDivert.dll","WinDivert64.sys" release-assets/ -ErrorAction SilentlyContinue
          Copy-Item "repo" release-assets/repo -Recurse -ErrorAction SilentlyContinue
          $sha = Get-FileHash release-assets/Vor-desktop.exe -Algorithm SHA256
          "$($sha.Hash.ToLower())  Vor-desktop.exe" | Out-File release-assets/SHA256SUMS.txt -Append
          $sha2 = Get-FileHash release-assets/Vor-desktop-setup.exe -Algorithm SHA256
          "$($sha2.Hash.ToLower())  Vor-desktop-setup.exe" | Out-File release-assets/SHA256SUMS.txt -Append
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: desktop/release-assets/*
          retention-days: 5

  desktop-linux:
    name: Linux binary + deb + AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: desktop/go.sum
      - name: Test + build
        working-directory: desktop
        run: |
          go vet ./...
          go test ./...
          # embed the production license public key when configured
          # (link-time var: desktop/internal/server/license_gate.go)
          go build -trimpath -ldflags "-s -w -X ezsni/internal/server.vorLicensePublicKey=${{ secrets.VOR_LICENSE_PUBLIC_KEY }}" -o vor-desktop .
      - name: deb package
        working-directory: desktop
        run: |
          # Debian policy: Version must start with a digit — 'vor-v1.0.0' is
          # rejected by dpkg-deb ("version number does not start with digit").
          # Strip the 'vor-v' tag prefix: 'vor-v1.0.0' -> '1.0.0'.
          VERSION="${GITHUB_REF_NAME#vor-v}"
          echo "deb version: $VERSION (from tag ${GITHUB_REF_NAME})"
          mkdir -p release-assets package/DEBIAN package/usr/local/bin package/usr/share/doc/vor
          cp vor-desktop package/usr/local/bin/vor-desktop
          cp ../LICENSE* package/usr/share/doc/vor/ 2>/dev/null || true
          # NOTE: no debhelper substitution variables — plain dpkg-deb does not
          # expand ${misc:Depends}; the Go binary is static, so no Depends.
          cat > package/DEBIAN/control <<EOF
          Package: vor-desktop
          Version: $VERSION
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: Vor maintainers
          Description: Vor Desktop - unified anti-censorship toolkit
           Vor merges SNI spoofing, DPI desync, the pattern engine, xray/
           sing-box process cores, DNS tunnels and Tor into one binary.
          EOF
          dpkg-deb --build package "release-assets/vor-desktop_${VERSION}-1_amd64.deb"
          dpkg-deb --info "release-assets/vor-desktop_${VERSION}-1_amd64.deb" || true
          cp vor-desktop release-assets/
      - name: AppImage (real, via appimagetool)
        working-directory: desktop
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#vor-v}"
          # appimagetool itself needs no FUSE with EXTRACT_AND_RUN (runners
          # have no /dev/fuse by default).
          curl -fL --retry 3 \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -o appimagetool
          chmod +x appimagetool
          APPDIR=appimage/vor-desktop.AppDir
          mkdir -p "$APPDIR/usr/bin"
          cp vor-desktop "$APPDIR/usr/bin/"
          cp vor.png "$APPDIR/vor.png"
          cat > "$APPDIR/vor-desktop.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Vor Desktop
          Exec=vor-desktop
          Icon=vor
          Terminal=true
          Categories=Network;
          Comment=Adaptive Anti-Censorship Toolkit (SNI tunnel + engines)
          EOF
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/vor-desktop" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool "$APPDIR" \
            "release-assets/Vor-v${VERSION}-desktop-x86_64.AppImage"
          test -s "release-assets/Vor-v${VERSION}-desktop-x86_64.AppImage"
          file "release-assets/Vor-v${VERSION}-desktop-x86_64.AppImage" | grep -qi appimage \
            || { echo "::error::produced file is not an AppImage"; exit 1; }
          rm -rf appimage appimagetool
      - name: Checksums
        working-directory: desktop
        run: (cd release-assets && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: desktop/release-assets/*
          retention-days: 5

  dns-tunnel-server:
    name: MasterDns VPN server binaries
    runs-on: ubuntu-latest
    strategy:
      # One architecture's flake must not cancel the sibling builds.
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: "386", name: "i386" }
          - { goos: linux, goarch: amd64, name: "amd64" }
          - { goos: linux, goarch: "arm", name: "armv7" }
          - { goos: linux, goarch: arm64, name: "arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: dns-tunnel/go.sum
      - name: Test + build server + client
        working-directory: dns-tunnel
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            # The upstream suite has one timing-sensitive cleanup test
            # (session_cleanup_test.go) — retry once so a scheduler flake on a
            # shared runner does not sink the release; a REAL failure still
            # fails the job on the second pass.
            go test ./... -count=1 || {
              echo "::warning::first test pass flaked — retrying once"
              sleep 5
              go test ./... -count=1
            }
          fi
          go build -trimpath -ldflags "-s -w -X masterdnsvpn-go/internal/version.BuildVersion=${{ github.ref_name }}" \
            -o "masterdnsvpn-server-${{ matrix.name }}" ./cmd/server
          go build -trimpath -ldflags "-s -w -X masterdnsvpn-go/internal/version.BuildVersion=${{ github.ref_name }}" \
            -o "masterdnsvpn-client-${{ matrix.name }}" ./cmd/client
      - uses: actions/upload-artifact@v7
        with:
          name: release-dns-${{ matrix.name }}
          path: |
            dns-tunnel/masterdnsvpn-server-${{ matrix.name }}
            dns-tunnel/masterdnsvpn-client-${{ matrix.name }}
          retention-days: 5

  openwrt:
    name: OpenWrt universal .ipk matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The universal package: one source, every target arch. Every matrix
          # entry maps to its REAL OpenWrt 24.10.0 SDK (filenames verified on
          # downloads.openwrt.org), so each .ipk is cross-compiled by the
          # target toolchain — never a native binary mislabeled as another
          # architecture. The job fails loudly if the SDK or build breaks.
          - { arch: "mipsel_24kc",              target: "ramips/mt7621",   sdk: "openwrt-sdk-24.10.0-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst" }
          - { arch: "mips_24kc",                target: "ath79/generic",   sdk: "openwrt-sdk-24.10.0-ath79-generic_gcc-13.3.0_musl.Linux-x86_64.tar.zst" }
          - { arch: "aarch64_cortex-a53",       target: "mvebu/cortexa53", sdk: "openwrt-sdk-24.10.0-mvebu-cortexa53_gcc-13.3.0_musl.Linux-x86_64.tar.zst" }
          - { arch: "arm_cortex-a7_neon-vfpv4", target: "sunxi/cortexa7",  sdk: "openwrt-sdk-24.10.0-sunxi-cortexa7_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst" }
          - { arch: "x86_64",                   target: "x86/64",          sdk: "openwrt-sdk-24.10.0-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst" }
    steps:
      - uses: actions/checkout@v7
      - name: Install SDK build dependencies
        run: sudo apt-get update && sudo apt-get install -y gawk libncurses-dev zstd
      - name: Download the target SDK
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 \
            "https://downloads.openwrt.org/releases/24.10.0/targets/${{ matrix.target }}/${{ matrix.sdk }}" \
            -o sdk.tar.zst
          test -s sdk.tar.zst
      - name: Cross-compile vor + luci-app-vor inside the SDK
        run: |
          set -euo pipefail
          mkdir sdk
          tar -I zstd -xf sdk.tar.zst -C sdk --strip-components=1
          cp -R openwrt/vor sdk/package/vor
          rm -rf sdk/package/vor/src/luci-app-vor
          cp -R openwrt/vor/src/luci-app-vor sdk/package/luci-app-vor
          cd sdk
          ./scripts/feeds update luci
          make defconfig
          make package/vor/compile -j"$(nproc)" || make package/vor/compile V=s
          make package/luci-app-vor/compile -j"$(nproc)" || make package/luci-app-vor/compile V=s
          echo '--- produced ipks ---'
          find bin -name '*.ipk' -print
      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find sdk/bin -name 'vor_*.ipk' -exec cp {} release-assets/ \;
          find sdk/bin -name 'luci-app-vor*.ipk' -exec cp {} release-assets/ \;
          if [ -z "$(ls release-assets/*.ipk 2>/dev/null)" ]; then
            echo "::error::SDK produced no .ipk for ${{ matrix.arch }}"
            exit 1
          fi
          (cd release-assets && sha256sum *.ipk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: release-openwrt-${{ matrix.arch }}
          path: release-assets/*
          retention-days: 5

  ios:
    name: iOS unsigned .ipa (TrollStore)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - name: Generate project + build ipa
        working-directory: ios
        run: |
          set -euo pipefail
          xcodegen
          xcodebuild -project Vor.xcodeproj -scheme Vor -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            VOR_LICENSE_PUBLIC_KEY="${{ secrets.VOR_LICENSE_PUBLIC_KEY }}" \
            -destination 'generic/platform=iOS' build 2>&1 | xcpretty; test ${PIPESTATUS[0]} -eq 0
          APP="build/Build/Products/Release-iphoneos/Vor.app"
          [ -d "$APP" ] || APP="build/Build/Products/Release-iphones/Vor.app"
          test -d "$APP" || { echo "::error::Vor.app was not produced"; exit 1; }
          # A green xcodebuild must yield a real compiled binary — verify
          # before packaging so a skeleton .app can never ship as an .ipa.
          test -f "$APP/Vor" || { echo "::error::compiled binary Vor.app/Vor is missing"; exit 1; }
          file "$APP/Vor" | grep -q "Mach-O" || { echo "::error::Vor.app/Vor is not Mach-O"; exit 1; }
          SIZE=$(stat -f%z "$APP/Vor")
          [ "$SIZE" -gt 500000 ] || { echo "::error::binary implausibly small ($SIZE bytes)"; exit 1; }
          # The production license key must actually be embedded (gate: the
          # release must verify prod-issued tokens, not dev-key defaults).
          EMBEDDED=$(plutil -extract VORLicensePublicKey raw -o - "$APP/Info.plist" 2>/dev/null || true)
          [ "$EMBEDDED" = "${{ secrets.VOR_LICENSE_PUBLIC_KEY }}" ] || \
            { echo "::error::production license key not embedded in Info.plist (got: ${EMBEDDED:0:8}...)"; exit 1; }
          rm -rf build/Payload build/Vor-iOS-unsigned.ipa
          mkdir -p build/Payload && cp -R "$APP" build/Payload/
          (cd build && zip -qry Vor-iOS-unsigned.ipa Payload)
          shasum -a 256 build/Vor-iOS-unsigned.ipa > build/SHA256SUMS.txt
          echo "Vor.app binary: $SIZE bytes; ipa: $(stat -f%z build/Vor-iOS-unsigned.ipa) bytes"
      - uses: actions/upload-artifact@v7
        with:
          name: release-ios
          path: |
            ios/build/Vor-iOS-unsigned.ipa
            ios/build/SHA256SUMS.txt
          retention-days: 5

  publish:
    name: Publish the unified release
    needs: [android, desktop-windows, desktop-linux, dns-tunnel-server, openwrt, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: all-artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find all-artifacts -type f \( -name "*.apk" -o -name "*.exe" -o -name "*.deb" \
            -o -name "*.ipk" -o -name "*.ipa" -o -name "*.tar.gz" -o -name "*.zip" -o -name "SHA256SUMS.txt" \
            -o -name "vor-*" -o -name "masterdnsvpn-*" -o -name "vor-desktop" -o -name "SHA256SUMS.addons.txt" \) \
            -exec cp {} release/ \; -print
          # consolidate checksums (APK/exe/ipk/ipa sums + the addon pack sums)
          cat all-artifacts/*/SHA256SUMS.txt all-artifacts/*/SHA256SUMS.addons.txt 2>/dev/null > release/SHA256SUMS.txt || true
      - name: Derive release version
        id: rel
        run: |
          VERSION="${GITHUB_REF_NAME#vor-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=Vor v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Fail loudly if a platform artifact is missing
        run: |
          set -e
          MISSING=""
          [ -n "$(ls release/*.apk 2>/dev/null)" ] || MISSING="$MISSING android-apk"
          [ -n "$(ls release/*.exe 2>/dev/null)" ] || MISSING="$MISSING windows-exe"
          [ -n "$(ls release/*.deb 2>/dev/null)" ] || MISSING="$MISSING linux-deb"
          [ -n "$(ls release/*.ipk 2>/dev/null)" ] || MISSING="$MISSING openwrt-ipk"
          [ -n "$(ls release/*.ipa 2>/dev/null)" ] || MISSING="$MISSING ios-ipa"
          if [ -n "$MISSING" ]; then
            echo "::error::missing platform artifacts:$MISSING"
            exit 1
          fi
          # Deep integrity gates: counts + sizes, so a green upstream job can
          # never smuggle a skeleton or partial artifact set into the release.
          APK_N=$(ls release/*.apk 2>/dev/null | wc -l)
          IPK_N=$(ls release/*.ipk 2>/dev/null | wc -l)
          ADDON_N=$(ls release/*-arm64-v8a.zip 2>/dev/null | wc -l)
          IPA_SZ=$(stat -c%s release/Vor-iOS-unsigned.ipa 2>/dev/null || stat -f%z release/Vor-iOS-unsigned.ipa)
          EXE_SZ=$(stat -c%s release/Vor-desktop.exe 2>/dev/null || stat -f%z release/Vor-desktop.exe)
          [ "$APK_N" -ge 5 ] || { echo "::error::expected >=5 APKs (5 ABI + license manager), got $APK_N"; exit 1; }
          [ "$IPK_N" -ge 5 ] || { echo "::error::expected >=5 .ipk packages (per-target matrix), got $IPK_N"; exit 1; }
          [ "$IPA_SZ" -gt 50000 ] || { echo "::error::ipa implausibly small ($IPA_SZ bytes) — skeleton?"; exit 1; }
          [ "$EXE_SZ" -gt 1000000 ] || { echo "::error::windows exe implausibly small ($EXE_SZ bytes)"; exit 1; }
          [ "$ADDON_N" -ge 5 ] || { echo "::error::expected >=5 arm64 addon zips (tor/lyrebird/snowflake/webtunnel/byedpi), got $ADDON_N"; exit 1; }
          echo "integrity: $APK_N APKs, $IPK_N ipks, $ADDON_N addon packs (arm64), ipa ${IPA_SZ}B, exe ${EXE_SZ}B — all gates passed"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ steps.rel.outputs.name }}"
          body: |
            # Vor v${{ steps.rel.outputs.version }}

            Unified release: all five platform artifacts from one tag.

            | Platform | Artifact | Notes |
            |---|---|---|
            | Android | `Vor-*-android-*-release.apk` (+ License Manager) | **Signed** (APK Signature Scheme v2) with the Vor release certificate — install directly from the download; the CI publish gate runs `apksigner verify` + certificate-fingerprint match **and a permission allowlist audit** on every APK; license gate on first launch |
            | Windows | `Vor-desktop.exe` + `Vor-desktop-setup.exe` (installer) + WinDivert files | Portable single binary **and** a real NSIS installer; default engine = Go desync; pattern (wrong-seq) engine selectable |
            | Linux | `vor-desktop` + `.deb` + real `.AppImage` | |
            | OpenWrt | `vor_${{ steps.rel.outputs.version }}-r1_<arch>.ipk` matrix | Universal package — one source, every target |
            | iOS | `Vor-iOS-unsigned.ipa` | **TrollStore only, iOS 14.0–16.6.1 era — NOT a general iOS solution** (see the release notes below) |
            | Addon packs | `tor/lyrebird/snowflake/webtunnel/byedpi/psiphon/dnstt-<abi>.zip` | On-demand engine binaries for the in-app Core Manager — resolved from **this** repo, **this** tag |

            ## v1.0.4 — one identity, one repo, everything self-hosted

            - **The Android app keeps the package identity `com.v2rayez.app`.** v1.0.x builds
              that switched to `com.vor.app` split the install base in two and re-triggered
              Google Play Protect's *"hasn't seen an app from this developer before"* block for
              every existing user — a new package name is a brand-new app as far as Android and
              Play Protect are concerned. Vor now installs as a **pure update** over your
              existing app (same package, `versionCode 104` > the previously installed `102`),
              keeping your data, settings and trust state. The display name stays **Vor**.
            - **Clock-rollback protection for licenses (offline, spec §3).** Verification time
              is now `max(device clock, monotonic ratchet)` where the ratchet persists the
              highest time ever observed — plus an opportunistic trusted-time check (majority
              vote over the `Date` headers of several independent HTTPS endpoints) whenever
              connectivity exists. Winding the device clock backward can no longer resurrect
              an expired license; fully offline devices still verify normally against the
              signed expiry. Documentation states the honest limits.
            - **Addon pipeline is self-hosted.** Every engine addon zip (tor, lyrebird,
              snowflake, webtunnel, byedpi, psiphon, dnstt — all four ABIs, sha256-verified) is
              built by this repo's release workflow and attached to this release; the in-app
              Core Manager resolves them from `ysa-py/Vor` at this tag. No dependency on any
              other repository.
            - **New brand icon everywhere.** The shield / faceted-gem "V" mark (cyan + violet,
              navy plate) is now the launcher icon on Android (adaptive + Android 13 themed
              monochrome), the License Manager icon, the iOS AppIcon (previously iconless),
              and the desktop installer/AppImage icon.
            - **Desktop updater fixed and rebranded.** "Check for updates" previously resolved
              binaries from a different, defunct project repo; it now resolves `Vor-desktop.exe`
              / `vor-desktop` from this repo's releases (`vor-v*` tags) with a correct
              version comparison, and the whole panel is rebranded Vor. Windows also ships a
              real NSIS installer (`Vor-desktop-setup.exe`) and Linux a real AppImage.
            - **License activation crash-proofing verified end-to-end** (the v1.0.2 fix): every
              path from paste → verify → persist is failure-tolerant and covered by tests.

            ## v1.0.3 — mid-session expiry enforcement (condensed)

            While connected, the signed expiry claim is re-verified at most once a minute —
            fully offline — and the tunnel tears down automatically the moment it stops
            verifying. License Manager is tested against real workflow-issued production
            tokens.

            ## Android permission footprint (unchanged since v1.0.1 hardening)

            This release keeps the permission set at the minimum: no
            `QUERY_ALL_PACKAGES` (scoped package visibility instead), no advertising
            identifiers, and a CI allowlist gate that fails the release if any APK ever
            requests a permission outside the approved set. The app requests only:
            `INTERNET`, `ACCESS_NETWORK_STATE`, `FOREGROUND_SERVICE(_SPECIAL_USE)`,
            `POST_NOTIFICATIONS`, `RECEIVE_BOOT_COMPLETED` (opt-in), and `CAMERA`
            (QR import, granted at runtime).

            ## How to install on Android (Play Protect)

            1. Download the APK that matches your phone: **`Vor-v${{ steps.rel.outputs.version }}-android-arm64-v8a-release.apk`** for any modern 64-bit phone (2016+); `armeabi-v7a` for old 32-bit devices.
            2. **Already have the app installed (any 1.0.x build)?** This version installs as a normal **update** — same package identity, same signing certificate, higher version code. Your settings and imported servers are preserved. Expect no warning beyond Android's usual "install update?" prompt.
            3. **Fresh install?** Because Vor is not published on Google Play, Play Protect may show its generic **"Blocked by Play Protect"** screen for ANY sideloaded app — that is not a defect in this app:
               - Tap **More details** → **Install anyway** (on some Android versions: *Install this unsafe app*).
               - Or temporarily disable scanning: Play Store → profile icon → Play Protect → settings gear → turn off **"Scan apps with Play Protect"**, install, turn it back on.
            4. All APKs in this release are **signed** (APK Signature Scheme v2) with the Vor release certificate and that signature is verified in CI before publishing — if Android installs it, the file is exactly what CI built.
            5. First launch shows the license gate: paste your license token (issued by this repo's `Issue License` workflow — Actions tab → "Issue License" → Run workflow, then download the artifact). Verification is fully offline.

            ## نصب روی اندروید (راهنمای فارسی)

            ۱. فایل **`Vor-v${{ steps.rel.outputs.version }}-android-arm64-v8a-release.apk`** را دانلود کنید (مناسب همهٔ گوشی‌های ۶۴بیتی امروزی؛ برای گوشی‌های قدیمی ۳۲بیتی فایل `armeabi-v7a`).
            ۲. **اگر از قبل اپ را نصب کرده‌اید** (هر نسخهٔ 1.0.x)، این نسخه به‌صورت یک **بروزرسانیِ عادی** نصب می‌شود — همان شناسهٔ بسته، همان گواهی امضا، شماره نسخهٔ بالاتر. تنظیمات و سرورهای شما حفظ می‌شود و انتظار هیچ هشدار خاصی نیست.
            ۳. **نصب تازه؟** چون وور در گوگل‌پلی منتشر نشده، ممکن است پیام عمومی **«Blocked by Play Protect»** را ببینید — این هشدارِ عمومیِ گوگل برای هر اپی است که بیرون از گوگل‌پلی نصب می‌شود، نه مشکلِ این اپ:
               - روی **جزئیات بیشتر (More details)** و بعد **نصب در هر صورت (Install anyway)** بزنید.
               - یا موقتاً اسکن را خاموش کنید: Play Store → آیکون پروفایل → Play Protect → تنظیمات → **Scan apps with Play Protect** را خاموش کنید، نصب را انجام دهید، بعد دوباره روشن کنید.
            ۴. همهٔ فایل‌های APK این ریلیز **امضاشده** هستند (طرح امضای v2) و امضای آن‌ها قبل از انتشار در CI تأیید می‌شود.
            ۵. در اجرای اول، صفحهٔ فعال‌سازی لایسنس باز می‌شود: توکن لایسنس را جای‌گذاری کنید (توکن از ورک‌فلوی «Issue License» در تب Actions همین مخزن صادر می‌شود). تأیید لایسنس کاملاً آفلاین است.

            ## iOS accuracy statement (read before installing on iOS)

            TrollStore only works on iOS versions with an unpatched persistence
            exploit (historically iOS 14.0–16.6.1 depending on device; this
            changes as Apple patches it). It does **not** work on the latest
            iOS. On unsupported versions use AltStore/Sideloadly with an Apple
            ID — a separate decision for the maintainer. Vor claims **no**
            general iOS compatibility.

            ## Licensing

            Licenses are issued offline by the `Issue License` workflow
            (workflow_dispatch). See `license/SPEC.md`. Honest limits:
            client-side checks raise the bar (signed, offline,
            tamper-evident, clock-rollback-resistant) but are not literally
            unbreakable.
          files: release/*
          generate_release_notes: true
