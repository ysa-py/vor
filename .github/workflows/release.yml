name: Release

# The coordinated five-platform release pipeline. One tag `vor-v*` builds
# every platform artifact and attaches all of them to ONE GitHub release.
# Every platform job runs its unit tests + lint first and fails loudly.

on:
  push:
    tags: ["vor-v*"]

permissions:
  contents: write

jobs:
  android:
    name: Android signed APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      # (setup-gradle has no working-directory input; the Gradle cache
      # auto-discovers the android/ project root)
      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#vor-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: google-services.json (optional)
        working-directory: android
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            printf '%s' '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
          fi
      - name: Release keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEYSTORE_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF
          else
            echo "::warning::KEYSTORE_BASE64 not set — building UNSIGNED release APK"
          fi
      - name: Build, test, lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :license-manager:testDebugUnitTest :app:lintRelease --stacktrace
          ./gradlew :app:assembleRelease :license-manager:assembleRelease \
            -Pv2rayez.addons.githubRepo=ovld-team/V2RayEZ \
            -Pv2rayez.addons.releaseTag=V2RayEZ-v1.0.1 \
            -Pvor.licensePublicKey="${{ secrets.VOR_LICENSE_PUBLIC_KEY }}" \
            --stacktrace
      - name: Stage artifacts
        working-directory: android
        run: |
          mkdir -p release-assets
          if [ -f app/build/outputs/apk/universal/release/app-universal-release.apk ]; then
            cp app/build/outputs/apk/universal/release/app-universal-release.apk \
               "release-assets/Vor-v${{ steps.version.outputs.version }}-android-universal-release.apk"
          fi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [ -f "app/build/outputs/apk/$abi/release/app-$abi-release.apk" ]; then
              cp "app/build/outputs/apk/$abi/release/app-$abi-release.apk" \
                 "release-assets/Vor-v${{ steps.version.outputs.version }}-android-$abi-release.apk"
            fi
          done
          cp license-manager/build/outputs/apk/release/license-manager-release.apk \
             "release-assets/Vor-v${{ steps.version.outputs.version }}-license-manager-release.apk" || true
          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v5
        with:
          name: release-android
          path: android/release-assets/*
          retention-days: 5

  desktop-windows:
    name: Windows exe (portable + installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: desktop/go.sum
      - name: Test + build
        working-directory: desktop
        run: |
          go vet ./...
          go test ./...
          # embed the production license public key when configured
          go build -trimpath -ldflags "-s -w -X main.vorLicensePublicKey=${{ secrets.VOR_LICENSE_PUBLIC_KEY }}" -o "Vor-desktop.exe" .
      - name: Stage portable bundle
        working-directory: desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "Vor-desktop.exe" release-assets/
          Copy-Item "WinDivert.dll","WinDivert64.sys" release-assets/ -ErrorAction SilentlyContinue
          Copy-Item "repo" release-assets/repo -Recurse -ErrorAction SilentlyContinue
          $sha = Get-FileHash release-assets/Vor-desktop.exe -Algorithm SHA256
          "$($sha.Hash.ToLower())  Vor-desktop.exe" | Out-File release-assets/SHA256SUMS.txt -Append
      - uses: actions/upload-artifact@v5
        with:
          name: release-windows
          path: desktop/release-assets/*
          retention-days: 5

  desktop-linux:
    name: Linux binary + deb + AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: desktop/go.sum
      - name: Test + build
        working-directory: desktop
        run: |
          go vet ./...
          go test ./...
          go build -trimpath -ldflags "-s -w" -o vor-desktop .
      - name: deb package
        working-directory: desktop
        run: |
          mkdir -p release-assets package/DEBIAN package/usr/local/bin package/usr/share/doc/vor
          cp vor-desktop package/usr/local/bin/vor-desktop
          cp ../LICENSE* package/usr/share/doc/vor/ 2>/dev/null || true
          cat > package/DEBIAN/control <<EOF
          Package: vor-desktop
          Version: ${{ github.ref_name }}
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: Vor maintainers
          Description: Vor Desktop - unified anti-censorship toolkit
           Vor merges SNI spoofing, DPI desync, the pattern engine, xray/
           sing-box process cores, DNS tunnels and Tor into one binary.
          Depends: \${misc:Depends}
          EOF
          dpkg-deb --build package release-assets/vor-desktop-${{ github.ref_name }}-amd64.deb
          cp vor-desktop release-assets/
      - name: AppImage (script-based, no packaging deps)
        working-directory: desktop
        run: |
          mkdir -p appimage/vor-desktop.AppDir/usr/bin
          cp vor-desktop appimage/vor-desktop.AppDir/usr/bin/
          cat > appimage/vor-desktop.AppDir/vor-desktop.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Vor Desktop
          Exec=vor-desktop
          Terminal=true
          Categories=Network;
          Comment=Unified anti-censorship toolkit (SNI tunnel + engines)
          EOF
          # Minimal AppImage: an appdir archive with run script (works with
          # AppImageLauncher and plain extraction; documented as such).
          (cd appimage/vor-desktop.AppDir && tar czf ../../release-assets/vor-desktop.AppDir.tar.gz .)
          rm -rf appimage
      - name: Checksums
        working-directory: desktop
        run: (cd release-assets && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v5
        with:
          name: release-linux
          path: desktop/release-assets/*
          retention-days: 5

  dns-tunnel-server:
    name: MasterDns VPN server binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: "386", name: "i386" }
          - { goos: linux, goarch: amd64, name: "amd64" }
          - { goos: linux, goarch: "arm", name: "armv7" }
          - { goos: linux, goarch: arm64, name: "arm64" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: dns-tunnel/go.sum
      - name: Test + build server + client
        working-directory: dns-tunnel
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            go test ./... -count=1
          fi
          go build -trimpath -ldflags "-s -w -X masterdnsvpn-go/internal/version.BuildVersion=${{ github.ref_name }}" \
            -o "masterdnsvpn-server-${{ matrix.name }}" ./cmd/server
          go build -trimpath -ldflags "-s -w -X masterdnsvpn-go/internal/version.BuildVersion=${{ github.ref_name }}" \
            -o "masterdnsvpn-client-${{ matrix.name }}" ./cmd/client
      - uses: actions/upload-artifact@v5
        with:
          name: release-dns-${{ matrix.name }}
          path: |
            dns-tunnel/masterdnsvpn-server-${{ matrix.name }}
            dns-tunnel/masterdnsvpn-client-${{ matrix.name }}
          retention-days: 5

  openwrt:
    name: OpenWrt universal .ipk matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The universal package: one source, every target arch. Every matrix
          # entry maps to its REAL OpenWrt 24.10.0 SDK (filenames verified on
          # downloads.openwrt.org), so each .ipk is cross-compiled by the
          # target toolchain — never a native binary mislabeled as another
          # architecture. The job fails loudly if the SDK or build breaks.
          - { arch: "mipsel_24kc",              target: "ramips/mt7621",   sdk: "openwrt-sdk-24.10.0-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst" }
          - { arch: "mips_24kc",                target: "ath79/generic",   sdk: "openwrt-sdk-24.10.0-ath79-generic_gcc-13.3.0_musl.Linux-x86_64.tar.zst" }
          - { arch: "aarch64_cortex-a53",       target: "mvebu/cortexa53", sdk: "openwrt-sdk-24.10.0-mvebu-cortexa53_gcc-13.3.0_musl.Linux-x86_64.tar.zst" }
          - { arch: "arm_cortex-a7_neon-vfpv4", target: "sunxi/cortexa7",  sdk: "openwrt-sdk-24.10.0-sunxi-cortexa7_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst" }
          - { arch: "x86_64",                   target: "x86/64",          sdk: "openwrt-sdk-24.10.0-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst" }
    steps:
      - uses: actions/checkout@v5
      - name: Install SDK build dependencies
        run: sudo apt-get update && sudo apt-get install -y gawk libncurses-dev zstd
      - name: Download the target SDK
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 \
            "https://downloads.openwrt.org/releases/24.10.0/targets/${{ matrix.target }}/${{ matrix.sdk }}" \
            -o sdk.tar.zst
          test -s sdk.tar.zst
      - name: Cross-compile vor + luci-app-vor inside the SDK
        run: |
          set -euo pipefail
          mkdir sdk
          tar -I zstd -xf sdk.tar.zst -C sdk --strip-components=1
          cp -R openwrt/vor sdk/package/vor
          rm -rf sdk/package/vor/src/luci-app-vor
          cp -R openwrt/vor/src/luci-app-vor sdk/package/luci-app-vor
          cd sdk
          ./scripts/feeds update luci
          make defconfig
          make package/vor/compile -j"$(nproc)" || make package/vor/compile V=s
          make package/luci-app-vor/compile -j"$(nproc)" || make package/luci-app-vor/compile V=s
          echo '--- produced ipks ---'
          find bin -name '*.ipk' -print
      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find sdk/bin -name 'vor_*.ipk' -exec cp {} release-assets/ \;
          find sdk/bin -name 'luci-app-vor*.ipk' -exec cp {} release-assets/ \;
          if [ -z "$(ls release-assets/*.ipk 2>/dev/null)" ]; then
            echo "::error::SDK produced no .ipk for ${{ matrix.arch }}"
            exit 1
          fi
          (cd release-assets && sha256sum *.ipk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v5
        with:
          name: release-openwrt-${{ matrix.arch }}
          path: release-assets/*
          retention-days: 5

  ios:
    name: iOS unsigned .ipa (TrollStore)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - name: Generate project + build ipa
        working-directory: ios
        run: |
          xcodegen
          xcodebuild -project Vor.xcodeproj -scheme Vor -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -destination 'generic/platform=iOS' build | xcpretty || exit 1
          APP="build/Build/Products/Release-iphoneos/Vor.app"
          [ -d "$APP" ] || APP="build/Build/Products/Release-iphones/Vor.app"
          rm -rf build/Payload build/Vor-iOS-unsigned.ipa
          mkdir -p build/Payload && cp -R "$APP" build/Payload/
          (cd build && zip -qry Vor-iOS-unsigned.ipa Payload)
          shasum -a 256 build/Vor-iOS-unsigned.ipa > build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v5
        with:
          name: release-ios
          path: |
            ios/build/Vor-iOS-unsigned.ipa
            ios/build/SHA256SUMS.txt
          retention-days: 5

  publish:
    name: Publish the unified release
    needs: [android, desktop-windows, desktop-linux, dns-tunnel-server, openwrt, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: all-artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find all-artifacts -type f \( -name "*.apk" -o -name "*.exe" -o -name "*.deb" \
            -o -name "*.ipk" -o -name "*.ipa" -o -name "*.tar.gz" -o -name "SHA256SUMS.txt" \
            -o -name "vor-*" -o -name "masterdnsvpn-*" -o -name "vor-desktop" \) \
            -exec cp {} release/ \; -print
          # consolidate checksums
          cat all-artifacts/*/SHA256SUMS.txt 2>/dev/null > release/SHA256SUMS.txt || true
      - name: Fail loudly if a platform artifact is missing
        run: |
          set -e
          MISSING=""
          [ -n "$(ls release/*.apk 2>/dev/null)" ] || MISSING="$MISSING android-apk"
          [ -n "$(ls release/*.exe 2>/dev/null)" ] || MISSING="$MISSING windows-exe"
          [ -n "$(ls release/*.deb 2>/dev/null)" ] || MISSING="$MISSING linux-deb"
          [ -n "$(ls release/*.ipk 2>/dev/null)" ] || MISSING="$MISSING openwrt-ipk"
          [ -n "$(ls release/*.ipa 2>/dev/null)" ] || MISSING="$MISSING ios-ipa"
          if [ -n "$MISSING" ]; then
            echo "::error::missing platform artifacts:$MISSING"
            exit 1
          fi
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "Vor ${{ github.ref_name }}"
          body: |
            # Vor ${{ github.ref_name }}

            Unified release: all five platform artifacts from one tag.

            | Platform | Artifact | Notes |
            |---|---|---|
            | Android | `Vor-*-android-*-release.apk` (+ License Manager) | Signed; license gate on first launch |
            | Windows | `Vor-desktop.exe` (+ WinDivert files) | Portable single binary; default engine = Go desync; pattern (wrong-seq) engine selectable |
            | Linux | `vor-desktop` + `.deb` + AppDir archive | |
            | OpenWrt | `vor_1.0.0_<arch>.ipk` matrix | Universal package — one source, every target |
            | iOS | `Vor-iOS-unsigned.ipa` | **TrollStore only, iOS 14.0–16.6.1 era — NOT a general iOS solution** (see the release notes below) |

            ## iOS accuracy statement (read before installing on iOS)

            TrollStore only works on iOS versions with an unpatched persistence
            exploit (historically iOS 14.0–16.6.1 depending on device; this
            changes as Apple patches it). It does **not** work on the latest
            iOS. On unsupported versions use AltStore/Sideloadly with an Apple
            ID — a separate decision for the maintainer. Vor claims **no**
            general iOS compatibility.

            ## Licensing

            Licenses are issued offline by the `Issue License` workflow
            (workflow_dispatch). See `license/SPEC.md`. Honest limits:
            client-side checks raise the bar (signed, offline,
            tamper-evident) but are not literally unbreakable.
          files: release/*
          generate-release-notes: true
