name: Vor
options:
  bundleIdPrefix: com.vor
  deploymentTarget:
    iOS: "15.0"
targets:
  Vor:
    type: application
    platform: iOS
    sources:
      - path: Vor
        excludes:
          # Unit tests compile in the VorTests target only — XCTest cannot
          # resolve inside the app target.
          - "LicenseTests.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vor.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Vor/Info.plist
        # Embedded license public key (dev default). Release builds override
        # on the xcodebuild command line:
        #   xcodebuild ... VOR_LICENSE_PUBLIC_KEY=<prod b64url>
        # and the plist substitutes it via $(VOR_LICENSE_PUBLIC_KEY).
        VOR_LICENSE_PUBLIC_KEY: "f54nNpWuth1MHZsbi6sdEODSDvWp7V6XSSDqWtmCyMA"
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: "NO"
  VorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Vor/LicenseTests.swift
    dependencies:
      - target: Vor
